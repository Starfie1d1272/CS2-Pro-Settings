name: Weekly reconcile

on:
  schedule:
    # Sunday 08:47 Asia/Shanghai (UTC+8) = 00:47 UTC Sunday
    - cron: "47 0 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: pipeline + checks, no issues/PRs"
        type: boolean
        default: true

concurrency:
  # shared with daily-update: never write runtime state concurrently
  group: cs2-pro-settings-production
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Restore runtime state cache
        id: restore-state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .runtime-state
          key: cs2-pro-settings-runtime-main-${{ github.run_id }}
          restore-keys: cs2-pro-settings-runtime-main-

      - name: Run pipeline (live, scheduled sources only)
        id: pipeline
        continue-on-error: true
        run: python -m cs2_pro_settings update --scheduled

      - name: Reconcile checks + monthly snapshot
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run }}
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
        run: python scripts/actions_weekly.py

      - name: Save runtime state cache (production success only)
        if: steps.pipeline.outcome == 'success' && github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .runtime-state
          key: cs2-pro-settings-runtime-main-${{ github.run_id }}

      - name: Final status gate
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "pipeline failed; quality issue was raised; workflow stays red"
          exit 1
