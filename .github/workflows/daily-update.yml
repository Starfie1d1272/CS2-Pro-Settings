name: Daily update

on:
  schedule:
    # 08:17 Asia/Shanghai (UTC+8) = 00:17 UTC
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: live fetch + analysis, no issues/commits/PRs"
        type: boolean
        default: true

concurrency:
  group: cs2-pro-settings-update
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run pipeline (live, scheduled sources only)
        run: python -m cs2_pro_settings update --scheduled

      - name: Decide and act (issues / candidate PR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run }}
        run: python scripts/actions_daily.py
