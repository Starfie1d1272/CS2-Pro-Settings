name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest -v

      - name: Offline fixture end-to-end (deterministic)
        run: |
          set -euo pipefail
          rm -rf work
          python -m cs2_pro_settings update --offline > /dev/null
          python -m cs2_pro_settings update --offline > /dev/null
          cp work/metrics.json /tmp/m1.json
          cp work/drift.json /tmp/d1.json
          cp work/report-candidate.md /tmp/r1.md
          python -m cs2_pro_settings update --offline > /dev/null
          diff /tmp/m1.json work/metrics.json
          diff /tmp/d1.json work/drift.json
          diff /tmp/r1.md work/report-candidate.md
          echo "deterministic OK (run2 == run3)"

      - name: No raw artifacts in tree
        run: |
          test -z "$(git status --porcelain work 2>/dev/null || true)"
          ! find . -path ./.git -prune -o -name '*.html' -path './tests/fixtures/*' -prune -o -name '*.html' -print | grep -q .
