# Cohort model v3 — manual HLTV Core + Watchlist + Supplemental.
#
# CORE: strictly defined by the last ACCEPTED manual HLTV Top 30 snapshot
#       (config/rankings/hltv/YYYY-MM-DD.yaml). No snapshot accepted yet ->
#       core.teams is empty; headline Core statistics are unavailable until
#       the first ranking snapshot is imported, reviewed and accepted.
#       HLTV itself is NEVER scraped (anti-bot; out of scope by policy).
# WATCHLIST: near-top30 / rising teams under observation. Manual entries are
#       candidates, NOT proof of current HLTV rank.
# SUPPLEMENTAL: regional / notable / legacy-selected teams.
#
# Tracked universe = Core ∪ Watchlist ∪ Supplemental.
# Headline metrics = Core only. Extended segments are reported separately.

cohort:
  core:
    provider: manual_hltv
    # last accepted structured HLTV snapshot; None until first import
    snapshot: null
    top_n: 30
    # populated only from accepted config/rankings/hltv/<date>.yaml
    teams: []

  watchlist:
    - team_id: bc-game
      settings_slug: null        # cs2settings has no BC.Game team page (unresolved)
      reason: manual_watchlist
      status: active
      added_at: "2026-08-10"
      note: manual watchlist candidate; not proof of current HLTV rank
    - team_id: 100-thieves
      settings_slug: "100-thieves"
      reason: manual_watchlist
      status: active
      added_at: "2026-08-10"
      note: manual watchlist candidate; not proof of current HLTV rank

