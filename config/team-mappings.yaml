# Team mapping: ranking display name -> canonical team id -> source slug.
#
# Used by the HLTV ranking importer (python -m cs2_pro_settings ranking
# import-hltv). The importer NEVER guesses: an unmapped display name is
# reported as UNRESOLVED and the import fails (or is emitted with explicit
# unresolved status and not activated).

teams:
  - display_names: [Vitality, "Team Vitality"]
    team_id: vitality
    settings_slug: vitality
  - display_names: [Spirit, "Team Spirit"]
    team_id: team-spirit
    settings_slug: spirit
  - display_names: [NAVI, "Natus Vincere"]
