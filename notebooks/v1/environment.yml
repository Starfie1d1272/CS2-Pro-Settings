# Historical v1 notebook environment (2026-05 snapshot reproduction only).
#
# The v1 notebooks (01_data_collection / 02_data_cleaning /
# 03_final_report) use seaborn and jupyter, which the v2 root environment
# intentionally does not include. Create this environment only if you need to
# reproduce the historical notebook pipeline.
name: cs2_data_v1
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas>=3.0.6
  - numpy>=2.5.3
  - matplotlib>=3.11.2
  - seaborn>=0.13.2
  - scikit-learn>=1.9.1
  - requests>=2.34.2
  - beautifulsoup4>=4.15.0
  - jupyter>=1.1.1
  - pip>=26.2.1
